<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ilustración del Paseo de la Reforma y el Ángel de la Independencia">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1c36"/>
      <stop offset="46%" stop-color="#123a6f"/>
      <stop offset="78%" stop-color="#2a6ba8"/>
      <stop offset="100%" stop-color="#6fa6c9"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb0d2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#cfe4f0" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22435f"/>
      <stop offset="100%" stop-color="#0b1d31"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/>
      <stop offset="52%" stop-color="#ddd3c0"/>
      <stop offset="100%" stop-color="#b9ad97"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6a8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffe6a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1110" cy="250" r="300" fill="url(#halo)"/>

  <!-- distant skyline -->
  <g fill="#0d2745" opacity=".85">
    <rect x="0" y="420" width="120" height="260"/>
    <rect x="95" y="360" width="70" height="320"/>
    <rect x="150" y="440" width="95" height="240"/>
    <rect x="230" y="330" width="60" height="350"/>
    <rect x="280" y="395" width="120" height="285"/>
    <rect x="1290" y="380" width="90" height="300"/>
    <rect x="1360" y="300" width="80" height="380"/>
    <rect x="1430" y="350" width="110" height="330"/>
    <rect x="1510" y="410" width="90" height="270"/>
  </g>
  <g fill="#123056" opacity=".9">
    <rect x="40" y="470" width="70" height="210"/>
    <rect x="330" y="420" width="60" height="260"/>
    <rect x="355" y="300" width="26" height="180"/>
    <rect x="1230" y="430" width="80" height="250"/>
    <rect x="1460" y="440" width="45" height="240"/>
  </g>

  <!-- Torre Latinoamericana style tower -->
  <g>
    <rect x="250" y="150" width="96" height="530" fill="#14365f"/>
    <rect x="258" y="150" width="80" height="530" fill="#1c4574"/>
    <g stroke="#3f739f" stroke-width="2" opacity=".55">
      <line x1="258" y1="190" x2="338" y2="190"/><line x1="258" y1="240" x2="338" y2="240"/>
      <line x1="258" y1="290" x2="338" y2="290"/><line x1="258" y1="340" x2="338" y2="340"/>
      <line x1="258" y1="390" x2="338" y2="390"/><line x1="258" y1="440" x2="338" y2="440"/>
      <line x1="258" y1="490" x2="338" y2="490"/><line x1="258" y1="540" x2="338" y2="540"/>
      <line x1="258" y1="590" x2="338" y2="590"/><line x1="258" y1="640" x2="338" y2="640"/>
    </g>
    <rect x="282" y="92" width="32" height="66" fill="#173c66"/>
    <rect x="292" y="52" width="12" height="46" fill="#173c66"/>
    <g fill="#ffd98a" opacity=".75">
      <rect x="270" y="205" width="6" height="8"/><rect x="300" y="255" width="6" height="8"/>
      <rect x="320" y="315" width="6" height="8"/><rect x="276" y="375" width="6" height="8"/>
      <rect x="310" y="435" width="6" height="8"/><rect x="286" y="500" width="6" height="8"/>
    </g>
  </g>

  <!-- modern glass slabs -->
  <g opacity=".92">
    <rect x="960" y="250" width="150" height="430" fill="#123156"/>
    <rect x="968" y="250" width="134" height="430" fill="#1b4a7c"/>
    <g stroke="#7fb0d2" stroke-width="1.4" opacity=".35">
      <line x1="968" y1="290" x2="1102" y2="290"/><line x1="968" y1="330" x2="1102" y2="330"/>
      <line x1="968" y1="370" x2="1102" y2="370"/><line x1="968" y1="410" x2="1102" y2="410"/>
      <line x1="968" y1="450" x2="1102" y2="450"/><line x1="968" y1="490" x2="1102" y2="490"/>
      <line x1="968" y1="530" x2="1102" y2="530"/><line x1="968" y1="570" x2="1102" y2="570"/>
      <line x1="968" y1="610" x2="1102" y2="610"/><line x1="968" y1="650" x2="1102" y2="650"/>
    </g>
    <rect x="1180" y="330" width="120" height="350" fill="#0f2c4e"/>
    <rect x="1188" y="330" width="104" height="350" fill="#18456f"/>
    <g stroke="#7fb0d2" stroke-width="1.2" opacity=".3">
      <line x1="1188" y1="380" x2="1292" y2="380"/><line x1="1188" y1="440" x2="1292" y2="440"/>
      <line x1="1188" y1="500" x2="1292" y2="500"/><line x1="1188" y1="560" x2="1292" y2="560"/>
      <line x1="1188" y1="620" x2="1292" y2="620"/>
    </g>
  </g>

  <!-- trees -->
  <g fill="#0e3a35">
    <ellipse cx="70" cy="620" rx="120" ry="120"/>
    <ellipse cx="190" cy="650" rx="90" ry="96"/>
    <ellipse cx="1420" cy="630" rx="140" ry="128"/>
    <ellipse cx="1530" cy="660" rx="110" ry="100"/>
  </g>
  <g fill="#14524a" opacity=".9">
    <ellipse cx="120" cy="600" rx="80" ry="80"/>
    <ellipse cx="1460" cy="605" rx="95" ry="84"/>
  </g>

  <!-- monument base -->
  <g>
    <rect x="700" y="742" width="220" height="26" rx="4" fill="#8f8674"/>
    <rect x="716" y="708" width="188" height="36" rx="3" fill="url(#marble)"/>
    <rect x="734" y="674" width="152" height="36" rx="3" fill="#cfc4af"/>
    <rect x="756" y="300" width="108" height="376" rx="3" fill="url(#marble)"/>
    <rect x="770" y="300" width="14" height="376" fill="#fffaf0" opacity=".55"/>
    <rect x="788" y="286" width="44" height="18" rx="2" fill="#e8dfcd"/>
    <rect x="768" y="642" width="84" height="34" rx="2" fill="#d9cfba"/>
    <rect x="792" y="602" width="36" height="40" fill="#cbbfa8"/>
  </g>

  <!-- angel silhouette -->
  <g fill="#f6f1e5">
    <path d="M810 250c0-14 8-24 8-34 0-8-6-12-6-22 0-13 11-22 23-22s23 9 23 22c0 10-6 14-6 22 0 10 8 20 8 34 0 8-8 12-8 12h-34s-8-4-8-12Z"/>
    <path d="M786 214c-18-10-30-26-28-44 16 6 30 16 40 30l-12 14Z"/>
    <path d="M850 214c18-10 30-26 28-44-16 6-30 16-40 30l12 14Z"/>
    <path d="M810 262c-12 12-18 30-18 50h18v-50Z"/>
    <path d="M826 262c12 12 18 30 18 50h-18v-50Z"/>
    <path d="M812 256c-6 0-10 4-10 10s4 10 10 10 10-4 10-10-4-10-10-10Z" fill="#d8cfbd"/>
  </g>

  <!-- foreground pavement, people -->
  <path d="M0 780h1600v120H0Z" fill="url(#ground)"/>
  <path d="M560 900 720 780h160l160 120Z" fill="#16334c" opacity=".8"/>
  <g fill="#08131f" opacity=".92">
    <circle cx="520" cy="800" r="10"/><rect x="513" y="808" width="15" height="34" rx="6"/>
    <circle cx="548" cy="812" r="8"/><rect x="542" y="819" width="12" height="28" rx="5"/>
    <circle cx="1062" cy="804" r="10"/><rect x="1055" y="812" width="15" height="32" rx="6"/>
    <circle cx="1092" cy="818" r="8"/><rect x="1086" y="825" width="12" height="24" rx="5"/>
    <circle cx="640" cy="822" r="8"/><rect x="634" y="829" width="12" height="24" rx="5"/>
    <circle cx="960" cy="826" r="8"/><rect x="954" y="833" width="12" height="22" rx="5"/>
  </g>
  <rect width="1600" height="900" fill="url(#haze)"/>

  <!-- brand petals, echoing the civic mark -->
  <g opacity=".92" filter="url(#soft)">
    <path d="M1300 300c40-46 96-40 104 6 8 44-40 74-92 58-26-8-30-38-12-64Z" fill="#f2b01e"/>
    <path d="M1386 380c56-18 96 12 78 56-18 42-76 46-108 10-18-20 6-58 30-66Z" fill="#d63f60" opacity=".9"/>
    <path d="M1310 470c44-26 92-4 84 38-8 40-64 58-102 26-20-16-4-50 18-64Z" fill="#10a88c" opacity=".9"/>
    <path d="M1420 520c40-6 66 25 48 58-18 32-70 32-92 0-12-18 8-54 44-58Z" fill="#6b4bd8" opacity=".85"/>
  </g>
</svg>
